<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HC Garden - A Nature Walking Trail Guide</title>
  <meta name="description" content="Explore the rich biodiversity of Hwa Chong Institution's garden campus with interactive maps and detailed species write-ups.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="assets/homeimage.jpg">

  <link rel="stylesheet" href="assets/fonts/google/lato.css">
  <link rel="stylesheet" href="assets/fonts/google/material-icons.css">
  <link rel="stylesheet" href="css/leaflet.css">
  <script src="js/tailwind.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-white text-gray-700 font-sans m-0 p-0" x-data="{ loaded: false }" x-init="$nextTick(() => loaded = true)">

  <!-- LOADING SCREEN -->
  <div x-show="$store.app.loading" class="fixed inset-0 z-50 bg-white flex items-center justify-center">
    <div class="text-center">
      <div class="inline-block w-12 h-12 border-4 border-gray-200 border-t-gray-600 rounded-full animate-spin mb-4"></div>
      <p class="text-gray-500 text-lg">Loading...</p>
    </div>
  </div>

  <!-- ERROR SCREEN -->
  <div x-show="$store.app.error" class="fixed inset-0 z-50 bg-white flex items-center justify-center">
    <div class="text-center p-8">
      <p class="text-red-500 text-lg mb-4" x-text="$store.app.error"></p>
      <button @click="location.reload()" class="bg-blue-500 text-white px-6 py-2 rounded">Retry</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div x-show="!$store.app.loading && !$store.app.error" x-cloak>

    <!-- HEADER BAR -->
    <header class="fixed top-0 left-0 right-0 h-14 bg-white border-b border-gray-200 flex items-center px-4 z-30">
      <button @click="$dispatch('toggle-sidebar')" class="p-2 -ml-2 text-gray-600 hover:text-gray-800">
        <span class="material-icons">menu</span>
      </button>
      <h1 class="flex-1 text-center text-base font-medium text-gray-700" x-text="$store.app.headerTitle"></h1>
      <template x-if="$store.app.showFilter">
        <button @click="$dispatch('open-filter-modal')" class="p-2 -mr-2 text-gray-600 hover:text-gray-800">
          <span class="material-icons">settings</span>
        </button>
      </template>
      <template x-if="!$store.app.showFilter">
        <div class="w-10"></div>
      </template>
    </header>

    <!-- SIDEBAR -->
    <div x-data="sidebar" x-show="open" x-transition.opacity @toggle-sidebar.window="toggle()" class="sidebar-overlay" @click.self="open = false">
      <div class="sidebar-panel" :class="open ? 'open' : ''" @click.stop>
        <nav class="pt-16 pb-8">
          <template x-for="item in navItems" :key="item.hash">
            <a :href="item.hash"
               @click.prevent="navigate(item.hash)"
               class="block px-6 py-3 text-gray-700 hover:bg-gray-100 transition-colors"
               :class="$store.app.currentRoute === item.route ? 'bg-gray-100 font-medium' : ''"
               x-text="item.label"></a>
          </template>
        </nav>
      </div>
    </div>

    <!-- CONTENT AREA (below header) -->
    <main class="pt-14 min-h-screen">

      <!-- HOME -->
      <div x-show="$store.app.currentRoute === 'home'" x-transition.opacity x-html="$store.app._templates.home || ''"></div>

      <!-- INTRODUCTION -->
      <div x-show="$store.app.currentRoute === 'introduction'" x-transition.opacity x-html="$store.app._templates.introduction || ''"></div>

      <!-- MAP -->
      <div x-show="$store.app.currentRoute === 'map'" x-transition.opacity x-html="$store.app._templates.map || ''"></div>

      <!-- OVERVIEW -->
      <div x-show="$store.app.currentRoute === 'overview'" x-transition.opacity x-html="$store.app._templates.overview || ''"></div>

      <!-- FLORA AND FAUNA -->
      <div x-show="$store.app.currentRoute === 'flora-fauna'" x-transition.opacity x-html="$store.app._templates['flora-fauna'] || ''"></div>

      <!-- SPECIES DETAIL -->
      <div x-show="$store.app.currentRoute === 'species'" x-transition.opacity x-html="$store.app._templates.species || ''"></div>

      <!-- HISTORICAL PHOTOS -->
      <div x-show="$store.app.currentRoute === 'history'" x-transition.opacity x-html="$store.app._templates.history || ''"></div>

      <!-- COMMITTEE MESSAGE -->
      <div x-show="$store.app.currentRoute === 'committee-message'" x-transition.opacity x-html="$store.app._templates['committee-message'] || ''"></div>

      <!-- ACKNOWLEDGEMENTS -->
      <div x-show="$store.app.currentRoute === 'acknowledgements'" x-transition.opacity x-html="$store.app._templates.acknowledgements || ''"></div>

      <!-- REFERENCES -->
      <div x-show="$store.app.currentRoute === 'references'" x-transition.opacity x-html="$store.app._templates.references || ''"></div>

    </main>

    <!-- FILTER MODAL -->
    <div x-data="filterModal" @open-filter-modal.window="openModal()">
      <dialog :open="isOpen" class="filter-dialog rounded-lg shadow-xl max-w-md mx-auto mt-20">
        <div class="relative p-6">
          <button @click="closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700">
            <span class="material-icons">close</span>
          </button>

          <!-- Type filters -->
          <template x-if="enableFilter.includes('type')">
            <div class="mb-6">
              <h3 class="text-base font-medium text-gray-700 mb-2">Types</h3>
              <template x-for="opt in typeOptions" :key="opt.id">
                <label class="flex items-center py-2 cursor-pointer">
                  <input type="checkbox" :checked="settings.type[opt.id]" @change="updateType(opt.id)" class="mr-3 w-5 h-5">
                  <span class="text-base text-gray-600" x-text="opt.name"></span>
                </label>
              </template>
            </div>
          </template>

          <!-- Trail filters -->
          <template x-if="enableFilter.includes('trail')">
            <div class="mb-6">
              <h3 class="text-base font-medium text-gray-700 mb-2">Trail</h3>
              <template x-for="opt in trailOptions" :key="opt.id">
                <label class="flex items-center justify-between py-2 cursor-pointer">
                  <span class="text-base text-gray-600" x-text="opt.name"></span>
                  <input type="radio" name="trail-filter" :value="opt.id" :checked="settings.trail === opt.id" @change="updateTrail(opt.id)" class="w-5 h-5">
                </label>
              </template>
            </div>
          </template>

          <!-- Sort filters -->
          <template x-if="enableFilter.includes('sortBy')">
            <div class="mb-6">
              <h3 class="text-base font-medium text-gray-700 mb-2">Sort by</h3>
              <template x-for="opt in sortOptions" :key="opt.id">
                <label class="flex items-center justify-between py-2 cursor-pointer">
                  <span class="text-base text-gray-600" x-text="opt.name"></span>
                  <input type="radio" name="sort-filter" :value="opt.id" :checked="settings.sortBy === opt.id" @change="updateSort(opt.id)" class="w-5 h-5">
                </label>
              </template>
            </div>
          </template>
        </div>
      </dialog>
    </div>

  </div>

  <!-- SCRIPTS -->
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/filter-modal.js"></script>
  <script src="js/components/ff-list.js"></script>
  <script src="js/components/ff-entry.js"></script>
  <script src="js/components/lightbox.js"></script>
  <script src="js/components/clickable-image.js"></script>
  <script src="js/components/overview.js"></script>
  <script src="js/leaflet.js"></script>
  <script src="js/map.js"></script>
  <script defer src="js/alpine.min.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('js/service-worker.js');
    }
  </script>
</body>
</html>

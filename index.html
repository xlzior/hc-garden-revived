<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HC Garden - A Nature Walking Trail Guide</title>
  <meta name="description" content="Explore the rich biodiversity of Hwa Chong Institution's garden campus with interactive maps and detailed species write-ups.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="assets/homeimage.jpg">

  <link rel="stylesheet" href="assets/fonts/google/lato.css">
  <link rel="stylesheet" href="assets/fonts/google/material-icons.css">
  <link rel="stylesheet" href="css/leaflet.css">
  <script src="js/tailwind.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-white text-gray-700 font-sans m-0 p-0" x-data="{ loaded: false }" x-init="$nextTick(() => loaded = true)">

  <!-- LOADING SCREEN -->
  <div x-show="$store.app.loading" class="fixed inset-0 z-50 bg-white flex items-center justify-center">
    <div class="text-center">
      <div class="inline-block w-12 h-12 border-4 border-gray-200 border-t-gray-600 rounded-full animate-spin mb-4"></div>
      <p class="text-gray-500 text-lg">Loading...</p>
    </div>
  </div>

  <!-- ERROR SCREEN -->
  <div x-show="$store.app.error" class="fixed inset-0 z-50 bg-white flex items-center justify-center">
    <div class="text-center p-8">
      <p class="text-red-500 text-lg mb-4" x-text="$store.app.error"></p>
      <button @click="location.reload()" class="bg-blue-500 text-white px-6 py-2 rounded">Retry</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div x-show="!$store.app.loading && !$store.app.error" x-cloak>

    <!-- HEADER BAR -->
    <header class="fixed top-0 left-0 right-0 h-14 bg-white border-b border-gray-200 flex items-center justify-center px-4 z-30">
      <template x-if="$store.app.currentRoute === 'overview' || $store.app.currentRoute === 'species'">
        <button @click="history.back()" class="absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center text-gray-600 hover:text-gray-800">
          <span class="material-icons">arrow_back</span>
        </button>
      </template>
      <h1 class="text-base font-medium text-gray-700" x-text="$store.app.headerTitle"></h1>
      <template x-if="$store.app.showFilter">
        <button @click="$dispatch('open-filter-modal')" class="absolute right-4 p-2 text-gray-600 hover:text-gray-800">
          <span class="material-icons">settings</span>
        </button>
      </template>
    </header>

    <!-- CONTENT AREA (below header) -->
    <main class="mt-14 relative overflow-y-auto box-border" style="height: calc(100vh - 56px - 56px - env(safe-area-inset-bottom))">

      <!-- MAP — always rendered, position:absolute with fixed dimensions, never changes -->
      <div id="route-map"></div>
      <!-- WHITE COVER — hides map when another tab is active, toggled imperatively -->
      <div id="route-map-cover"></div>

      <!-- OVERVIEW -->
      <div x-show="$store.app.currentRoute === 'overview'" id="route-overview" class="relative z-20 bg-white" style="min-height: calc(100vh - 56px - 56px - env(safe-area-inset-bottom))"></div>

      <!-- CATALOG (Flora and Fauna) -->
      <div x-show="$store.app.currentRoute === 'catalog'" id="route-catalog" class="relative z-20 bg-white"></div>

      <!-- SPECIES DETAIL -->
      <div x-show="$store.app.currentRoute === 'species'" id="route-species" class="relative z-20 bg-white"></div>

      <!-- HISTORICAL PHOTOS -->
      <div x-show="$store.app.currentRoute === 'history'" id="route-history" class="relative z-20 bg-white"></div>

      <!-- INFO (Acknowledgements + References) -->
      <div x-show="$store.app.currentRoute === 'info'" id="route-info" class="relative z-20 bg-white"></div>

    </main>

    <!-- TAB BAR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex items-stretch z-30" style="padding-bottom: env(safe-area-inset-bottom)">
      <a href="#map" @click.prevent="$store.app.navigate('map', '#map')"
         class="h-14 flex-1 flex flex-col items-center justify-center gap-0.5 transition-colors"
         :class="$store.app.currentRoute === 'map' || $store.app.currentRoute === 'overview' ? 'text-blue-500' : 'text-gray-400'">
        <span class="material-icons text-[22px]">map</span>
        <span class="text-[10px] leading-tight font-medium">Map</span>
      </a>
      <a href="#catalog" @click.prevent="$store.app.navigate('catalog', '#catalog')"
         class="h-14 flex-1 flex flex-col items-center justify-center gap-0.5 transition-colors"
         :class="$store.app.currentRoute === 'catalog' || $store.app.currentRoute === 'species' ? 'text-blue-500' : 'text-gray-400'">
        <span class="material-icons text-[22px]">collections_bookmark</span>
        <span class="text-[10px] leading-tight font-medium">Catalog</span>
      </a>
      <a href="#history" @click.prevent="$store.app.navigate('history', '#history')"
         class="h-14 flex-1 flex flex-col items-center justify-center gap-0.5 transition-colors"
         :class="$store.app.currentRoute === 'history' ? 'text-blue-500' : 'text-gray-400'">
        <span class="material-icons text-[22px]">photo_library</span>
        <span class="text-[10px] leading-tight font-medium">History</span>
      </a>
      <a href="#info" @click.prevent="$store.app.navigate('info', '#info')"
         class="h-14 flex-1 flex flex-col items-center justify-center gap-0.5 transition-colors"
         :class="$store.app.currentRoute === 'info' ? 'text-blue-500' : 'text-gray-400'">
        <span class="material-icons text-[22px]">info</span>
        <span class="text-[10px] leading-tight font-medium">Info</span>
      </a>
    </nav>

    <!-- FILTER MODAL -->
    <div x-data="filterModal" @open-filter-modal.window="openModal()">
      <dialog :open="isOpen" class="filter-dialog rounded-lg shadow-xl max-w-md mx-auto mt-20">
        <div class="relative p-6">
          <button @click="closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700">
            <span class="material-icons">close</span>
          </button>

          <!-- Type filters -->
          <template x-if="enableFilter.includes('type')">
            <div class="mb-6">
              <h3 class="text-base font-medium text-gray-700 mb-2">Types</h3>
              <template x-for="opt in typeOptions" :key="opt.id">
                <label class="flex items-center py-2 cursor-pointer">
                  <input type="checkbox" :checked="settings.type[opt.id]" @change="updateType(opt.id)" class="mr-3 w-5 h-5">
                  <span class="text-base text-gray-600" x-text="opt.name"></span>
                </label>
              </template>
            </div>
          </template>

          <!-- Trail filters -->
          <template x-if="enableFilter.includes('trail')">
            <div class="mb-6">
              <h3 class="text-base font-medium text-gray-700 mb-2">Trail</h3>
              <template x-for="opt in trailOptions" :key="opt.id">
                <label class="flex items-center justify-between py-2 cursor-pointer">
                  <span class="text-base text-gray-600" x-text="opt.name"></span>
                  <input type="radio" name="trail-filter" :value="opt.id" :checked="settings.trail === opt.id" @change="updateTrail(opt.id)" class="w-5 h-5">
                </label>
              </template>
            </div>
          </template>

          <!-- Sort filters -->
          <template x-if="enableFilter.includes('sortBy')">
            <div class="mb-6">
              <h3 class="text-base font-medium text-gray-700 mb-2">Sort by</h3>
              <template x-for="opt in sortOptions" :key="opt.id">
                <label class="flex items-center justify-between py-2 cursor-pointer">
                  <span class="text-base text-gray-600" x-text="opt.name"></span>
                  <input type="radio" name="sort-filter" :value="opt.id" :checked="settings.sortBy === opt.id" @change="updateSort(opt.id)" class="w-5 h-5">
                </label>
              </template>
            </div>
          </template>
        </div>
      </dialog>
    </div>

  </div>

  <!-- SCRIPTS -->
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/components/filter-modal.js"></script>
  <script src="js/components/ff-list.js"></script>
  <script src="js/components/ff-entry.js"></script>
  <script src="js/components/clickable-image.js"></script>
  <script src="js/leaflet.js"></script>
  <script src="js/map.js"></script>
  <script defer src="js/alpine.min.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('js/service-worker.js');
    }
  </script>
</body>
</html>

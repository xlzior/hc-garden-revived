<div x-data="ffEntry">
  <div class="species-detail-layout">
    <!-- Image -->
    <div class="species-image">
      <template x-if="imageRef && imageRef.length > 0">
        <div>
          <div class="species-image-square relative overflow-hidden cursor-pointer" x-ref="inlineImageContainer"
               x-init="$nextTick(() => initInlineSwipe())" @click="openLightbox(imageIndex)">
            <img :src="blurImages[imageIndex]" class="absolute inset-0 w-full h-full object-cover blur-xl scale-110" aria-hidden="true">
            <img :src="images[imageIndex]" :alt="name" class="relative w-full h-full object-contain" loading="lazy" @error="$event.target.style.display='none'">
          </div>
          <template x-if="images.length > 1">
            <div class="flex justify-center gap-1.5 py-2">
              <template x-for="(_, i) in images" :key="i">
                <span class="w-2 h-2 rounded-full transition-colors" :class="i === imageIndex ? 'bg-gray-700' : 'bg-gray-300'"></span>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- Details -->
    <div class="species-info p-5 pb-24">
      <h2 class="text-2xl font-medium text-gray-700 mt-2" x-text="name"></h2>
      <p class="text-sm text-gray-600 mt-1" x-html="formattedSciName"></p>
      <p class="text-base text-gray-600 font-light mt-4 text-justify whitespace-pre-line" x-text="description"></p>

      <!-- Locations -->
      <template x-if="locationList.length > 0">
        <div class="mt-6">
          <h3 class="text-lg font-medium text-gray-700">Locations: </h3>
          <template x-for="loc in locationList" :key="loc.id">
            <div class="flex items-center py-3 border-b border-gray-100 cursor-pointer" @click="goToLocation(loc.id)" style="padding-left:15px;">
              <span class="flex-1 text-base text-gray-700" x-text="loc.title"></span>
              <span class="material-icons text-gray-400">chevron_right</span>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>

  <!-- Lightbox -->
  <template x-if="lightboxOpen">
    <div class="fixed inset-0 z-50 bg-black bg-opacity-95 flex items-center justify-center"
         x-ref="lightboxContainer" x-init="$nextTick(() => initLightboxSwipe())"
         @click.self="closeLightbox()">
      <button class="absolute top-4 right-4 text-white text-3xl" @click="closeLightbox()">&times;</button>
      <template x-if="lightboxImages.length > 1">
        <button class="absolute left-4 text-white text-4xl" @click.stop="prevImage()" x-show="lightboxIndex > 0">&#8249;</button>
      </template>
      <img :src="lightboxImages[lightboxIndex]" class="max-w-[90vw] max-h-[90vh] object-contain" style="touch-action: manipulation;">
      <template x-if="lightboxImages.length > 1">
        <button class="absolute right-4 text-white text-4xl" @click.stop="nextImage()" x-show="lightboxIndex < lightboxImages.length - 1">&#8250;</button>
      </template>
    </div>
  </template>
</div>
